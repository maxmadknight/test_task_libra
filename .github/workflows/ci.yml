name: CI/CD

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality And Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: library
          POSTGRES_USER: library
          POSTGRES_PASSWORD: library
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U library -d library"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      APP_DEBUG: false
      APP_KEY: base64:ZmFrZS1hcHAta2V5LWZvci10ZXN0cy1vbmx5LTAwMDA=
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: library
      DB_USERNAME: library
      DB_PASSWORD: library
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, zip
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '25'
          cache: npm

      - name: Validate Composer
        run: composer validate --strict --no-check-publish

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan config:clear

      - name: Build Frontend Assets
        run: npm run build

      - name: Laravel Routes Sanity Check
        run: php artisan route:list --except-vendor

      - name: Laravel Pint
        run: vendor/bin/pint --test

      - name: Larastan PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=512M

      - name: Pest Feature Tests
        run: vendor/bin/pest

      - name: Prepare ChromeDriver
        run: php artisan dusk:chrome-driver --detect

      - name: Start Laravel Server
        run: php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/ci-server.log 2>&1 &

      - name: Wait For Laravel Server
        run: |
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/books >/dev/null; then
              exit 0
            fi

            sleep 1
          done

          cat storage/logs/ci-server.log
          exit 1

      - name: Laravel Dusk
        run: php artisan dusk

      - name: Validate OpenSpec
        run: npx -y @fission-ai/openspec@latest validate build-library-management-app --strict

      - name: Upload Dusk Artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dusk-artifacts
          path: |
            tests/Browser/screenshots
            tests/Browser/console
            storage/logs
